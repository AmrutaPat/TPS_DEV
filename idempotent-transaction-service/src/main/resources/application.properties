spring.application.name=idempotent-transaction-service
server.port=8080

spring.datasource.url=jdbc:h2:mem:transactionsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Background worker
app.worker.enabled=true
app.worker.fixed-delay-ms=1500
app.worker.batch-size=20
app.worker.max-attempts=5
app.worker.initial-backoff-ms=2000
app.worker.max-backoff-ms=60000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
